############################################################
# HCMExonDel configuration file
#
# Format:
#   KEY=VALUE
#
# Notes:
#   1. Lines beginning with # are ignored.
#   2. Inline comments are allowed after values:
#        KEY=VALUE   # comment
#   3. BAM list is specified by HCMExonDel.pl --BamList.
#   4. Output directory is specified by HCMExonDel.pl --OutDir.
#   5. MANE annotation files use 1-based closed coordinates and are selected
#      automatically by HCMExonDel.pl --GenomeBuild.
#   6. No BED file is required from users.
#   7. HCMExonDel only analyzes HCM core genes listed in
#      HCM_CORE_GENE_LIST.
#   8. The original WGS BAM is first reduced to one target BAM:
#        SAMPLE.target.bam
#      containing HCM core genes + TARGET_REGION_FLANK.
#   9. Downstream depth, split-read, TLEN QC and discordant-read
#      analyses all use the generated SAMPLE.target.bam.
#  10. Candidate gene BAM extraction has been removed from the
#      standard workflow.
#  11. MergeEvidence.pl uses split-read clusters as candidate
#      events and validates them with depth and discordant evidence.
############################################################


############################################################
# 1. Runtime executables
############################################################

# Python executable used by plotting scripts.
#
# Used by:
#   PlotDepthRatio.py
#   PlotTLENDistribution.py
# PYTHON=/usr/bin/python3
PYTHON=/home/fulongfei/miniconda3/bin/python

# Samtools executable.
#
# Used by:
#   ExtractTargetBAM.pl
#   RunGeneMeanDepth.pl
#   ExtractSASplitReads.pl
#   ExtractValidTLEN.pl
#   RunDiscordantReads.pl
SAMTOOLS=/opt/PUB/software/Bin/samtools-1.16.1/bin/samtools


############################################################
# 2. HCM core gene selection and target BAM extraction
############################################################

# HCM core gene list.
#
# Expected format:
#   Gene Classification
#   MYBPC3 Definitive
#   MYH7 Definitive
#   FHOD3 Moderate
#
# Only the first column is used as the gene symbol.
# The header line "Gene Classification" is allowed.
#
# Used by:
#   ExtractTargetBAM.pl
#   RunGeneMeanDepth.pl
#
# Note:
#   ExtractSASplitReads.pl and RunDiscordantReads.pl do not read
#   this file directly. They scan SAMPLE.target.bam.
HCM_CORE_GENE_LIST=/ehpcdata/fulongfei/git_repo/WGSExonDel/db/Genes/HCMClassic8Genes.tsv

# Flanking size added to HCM core gene regions when generating
# SAMPLE.target.bam.
#
# Unit:
#   bp
#
# Examples:
#   0    : strict gene region
#   5000 : gene region +/- 5000 bp
#
# Used by:
#   ExtractTargetBAM.pl
#
# Note:
#   Downstream split-read and discordant-read scripts do not read this
#   parameter directly. They use the target BAM generated here.
TARGET_REGION_FLANK=5000

# Threads used by samtools when extracting, sorting and indexing
# SAMPLE.target.bam.
#
# Used by:
#   ExtractTargetBAM.pl
TARGET_BAM_THREADS=4


############################################################
# 3. Common read filters
############################################################

# Global minimum mapping quality.
#
# Reads with MAPQ lower than MIN_MAPQ are filtered out.
#
# Used by:
#   RunGeneMeanDepth.pl
#   ExtractSASplitReads.pl
#   ExtractValidTLEN.pl
#   RunDiscordantReads.pl
MIN_MAPQ=20

# Global duplicate-read filter.
#
# 1: exclude duplicate reads
# 0: keep duplicate reads
#
# Used by:
#   RunGeneMeanDepth.pl
#   ExtractSASplitReads.pl
#   ExtractValidTLEN.pl
#   RunDiscordantReads.pl
EXCLUDE_DUPLICATES=1


############################################################
# 4. Window-level depth-ratio analysis
############################################################

# Window size for depth-ratio calculation.
#
# Unit:
#   bp
#
# Used by:
#   RunGeneMeanDepth.pl
WINDOW_SIZE=500

# Window step size.
#
# Unit:
#   bp
#
# Used by:
#   RunGeneMeanDepth.pl
WINDOW_STEP=200

# Minimum accepted window size, mainly for terminal windows.
#
# Unit:
#   bp
#
# Used by:
#   RunGeneMeanDepth.pl
MIN_WINDOW_SIZE=200

# Minimum gene mean depth.
#
# Genes with mean depth lower than this value are still processed,
# but their windows will not be evaluated as deletion-supporting.
#
# Used by:
#   RunGeneMeanDepth.pl
MIN_GENE_MEAN_DEPTH=20

# Depth ratio cutoff for deletion-supporting windows.
#
# For heterozygous exon deletion in WGS, 0.65 is a practical cutoff.
#
# Used by:
#   RunGeneMeanDepth.pl
DEL_DEPTH_RATIO_CUTOFF=0.65

# Minimum number of consecutive deletion-supporting windows required
# to generate one window-level depth candidate.
#
# Used by:
#   RunGeneMeanDepth.pl
MIN_CONSECUTIVE_DEL_WINDOWS=3


############################################################
# 5. CUSUM depth evidence parameters
############################################################

# Baseline depth used for CUSUM calculation.
#
# auto:
#   estimate baseline from each input gene depth file automatically.
#
# numeric value:
#   use fixed baseline depth.
#
# Used by:
#   RunSampleCUSUMDepth.pl
#   CUSUMDepthDel.pl
CUSUM_BASELINE=auto

# Bin size for CUSUM input.
#
# For base-level depth files, keep 1.
#
# Used by:
#   RunSampleCUSUMDepth.pl
#   CUSUMDepthDel.pl
CUSUM_BIN_SIZE=1

# CUSUM reference shift parameter.
#
# Larger K makes CUSUM less sensitive to mild depth fluctuation.
#
# Used by:
#   RunSampleCUSUMDepth.pl
#   CUSUMDepthDel.pl
CUSUM_K=0.1

# CUSUM calling threshold.
#
# Larger H makes deletion calling more stringent and reduces false positives.
#
# Used by:
#   RunSampleCUSUMDepth.pl
#   CUSUMDepthDel.pl
CUSUM_H=5

# Depth ratio threshold for deletion-like bins in CUSUM.
#
# This parameter is specific to CUSUM depth evidence.
# Do not confuse it with DEL_DEPTH_RATIO_CUTOFF, which is used by
# window-level depth-ratio analysis.
#
# Used by:
#   RunSampleCUSUMDepth.pl
#   CUSUMDepthDel.pl
CUSUM_DEL_RATIO=0.65

# Minimum number of bins required for one CUSUM DEL segment.
#
# This parameter is specific to CUSUM depth evidence.
# Do not confuse it with MIN_CONSECUTIVE_DEL_WINDOWS, which is used by
# window-level depth-ratio analysis.
#
# Used by:
#   RunSampleCUSUMDepth.pl
#   CUSUMDepthDel.pl
CUSUM_MIN_BINS=3

# Minimum length required for one CUSUM DEL segment.
#
# Unit:
#   bp
#
# Used by:
#   RunSampleCUSUMDepth.pl
#   CUSUMDepthDel.pl
CUSUM_MIN_LEN=1

# Segment edge refinement ratio.
#
# Used by:
#   RunSampleCUSUMDepth.pl
#   CUSUMDepthDel.pl
CUSUM_EDGE_RATIO=0.80

# Recovery ratio used to determine when a CUSUM signal returns to baseline.
#
# Used by:
#   RunSampleCUSUMDepth.pl
#   CUSUMDepthDel.pl
CUSUM_RECOVER_RATIO=0.80

# Number of consecutive recovered bins required to terminate a CUSUM segment.
#
# Used by:
#   RunSampleCUSUMDepth.pl
#   CUSUMDepthDel.pl
CUSUM_RECOVER_BINS=3


############################################################
# 6. SA split-read extraction and clustering
############################################################

# Threads used by samtools during SA split-read extraction.
#
# Used by:
#   ExtractSASplitReads.pl
SPLIT_READ_THREADS=4

# Maximum allowed breakpoint difference for clustering SA split-read
# deletion events.
#
# Both SV_Start and SV_End should be within this window for clustering.
#
# Unit:
#   bp
#
# Used by:
#   ClusterSASplitReads.pl
SA_SPLIT_CLUSTER_WINDOW=20

# Minimum number of unique read names required for an SA split-read
# cluster to be marked as Pass.
#
# Used by:
#   ClusterSASplitReads.pl
SA_SPLIT_MIN_SUPPORT_READS=5


############################################################
# 7. Optional TLEN QC
############################################################

# Whether to run TLEN distribution QC.
#
# 1: run ExtractValidTLEN.pl and PlotTLENDistribution.py
# 0: skip TLEN QC
#
# Used by:
#   HCMExonDel.pl
RUN_TLEN_QC=1

# Maximum number of valid positive TLEN pairs sampled for TLEN QC.
#
# Reservoir sampling is used when the number of valid TLEN values exceeds
# this threshold.
#
# Used by:
#   ExtractValidTLEN.pl
TLEN_MAX_PAIRS=1000000

# Threads used by samtools during TLEN extraction.
#
# Used by:
#   ExtractValidTLEN.pl
TLEN_THREADS=4

# Random seed used for TLEN reservoir sampling.
#
# Used by:
#   ExtractValidTLEN.pl
TLEN_RANDOM_SEED=20260701


############################################################
# 8. Discordant read-pair analysis
############################################################

# Minimum inferred insert size for deletion-like read pairs.
#
# Unit:
#   bp
#
# Used by:
#   RunDiscordantReads.pl
MIN_DISCORDANT_INSERT_SIZE=500

# Minimum number of discordant read pairs required to support one cluster.
#
# Used by:
#   RunDiscordantReads.pl
MIN_DISCORDANT_PAIRS=3

# Maximum distance for clustering nearby discordant read-pair signals.
#
# Unit:
#   bp
#
# Used by:
#   RunDiscordantReads.pl
DISCORDANT_CLUSTER_DISTANCE=500

# Whether to require deletion-like paired-end orientation.
#
# 1: keep deletion-like inward-facing FR orientation
# 0: do not filter by orientation
#
# Used by:
#   RunDiscordantReads.pl
FILTER_DELETION_ORIENTATION=1

# Threads used by samtools during discordant read-pair extraction.
#
# Used by:
#   RunDiscordantReads.pl
DISCORDANT_READ_THREADS=4


############################################################
# 9. Evidence merging
############################################################

# Minimum fraction of split DEL bases that must be covered by
# depth evidence or discordant evidence.
#
# Example:
#   0.90 means at least 90% of the split-read-defined DEL interval
#   must be covered by the corresponding evidence.
#
# Merge logic:
#   split cluster = candidate backbone
#   depth evidence = supporting validation
#   discordant evidence = supporting validation
#
# Used by:
#   HCMExonDel.pl
#   MergeEvidence.pl
EVIDENCE_OVERLAP_FRACTION=0.90


############################################################
# 10. Candidate exon annotation
############################################################

# Minimum fraction of an exon that must be overlapped by a candidate
# deletion interval to be considered affected.
#
# Definition:
#   exon_overlap_fraction = overlap_length / exon_length
#
# 0.20: sensitive exon-level annotation
# 0.50: stricter exon-level annotation
#
# Used by:
#   AnnotateCandidates.pl
MIN_EXON_OVERLAP_FRACTION=0.20


